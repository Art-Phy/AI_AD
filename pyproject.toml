
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidetect"
version = "0.9.0"
description = "AI authorship detector using explainable heuristics"
readme = "README.md"
requires-python = ">=3.10"

authors = [
  {name = "Arturo Sanma"}
]

license = {text = "MIT"}

dependencies = [
  "fastapi",
  "uvicorn",
]

[project.scripts]
aidetect-cli = "aidetect.cli:main"
aidetect-api = "aidetect.api.run:main"