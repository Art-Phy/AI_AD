
# pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidetect"
version = "1.0.2"
description = "AI authorship detector using explainable heuristics"
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name = "Arturo Sanma" }
]

license = { text = "MIT" }

dependencies = [
  "fastapi",
  "uvicorn",
]

[project.scripts]
aidetect-cli = "aidetect.cli:main"
aidetect-api = "aidetect.api.run:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]